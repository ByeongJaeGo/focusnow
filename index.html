<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>focusnow</title>
  <meta name="description" content="결과가 아닌 오늘의 경험과 과정 기록. 사진 한 장, 간단한 한 줄로 오늘을 남기세요." />
  <meta name="robots" content="index,follow" />
  <!-- 네이버 서치어드바이저 소유확인 메타태그를 아래에 붙여넣으세요 -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xsuaolun00");
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1d1a;
      --muted: #5c635c;
      --line: rgba(26, 29, 26, 0.12);
      --surface: rgba(255, 255, 255, 0.55);
      --accent: #2f6b4f;
      --glow: rgba(47, 107, 79, 0.18);
      --danger: #b33a2e;
      --ok: #2f6b4f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Figtree", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 15% -10%, rgba(143, 186, 164, 0.35), transparent 60%),
        radial-gradient(900px 600px at 100% 20%, rgba(196, 176, 140, 0.28), transparent 55%),
        linear-gradient(165deg, #e7ece8 0%, #d9e0db 45%, #cfd7d1 100%);
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem 3rem;
      overflow-x: hidden;
      position: relative;
    }

    .topbar {
      position: fixed;
      top: 1.1rem;
      right: 1.1rem;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65rem;
      margin: 0;
      width: auto;
      animation: fade-in 0.8s ease 0.1s both;
    }

    .welcome {
      font-size: 0.9rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--line);
      padding: 0.35rem 0.65rem;
      border-radius: 2px;
    }

    .welcome strong {
      color: var(--ink);
      font-weight: 600;
    }

    .ghost-btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .ghost-btn:hover {
      background: #fff;
      border-color: rgba(26, 29, 26, 0.22);
    }

    .stage {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
      animation: fade-in 1s ease 0.15s both;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }

    .brand span {
      display: inline-block;
      color: var(--accent);
    }

    .brand:hover {
      opacity: 0.85;
    }

    .brand-sub {
      margin-top: -0.85rem;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--muted);
      animation: fade-in 1s ease 0.2s both;
    }

    .tagline {
      width: 100%;
      text-align: center;
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--muted);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    .tagline em {
      display: block;
      font-style: normal;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    /* Auth */
    .auth-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.5) inset,
        0 24px 48px -28px rgba(26, 29, 26, 0.35);
      padding: 1.5rem 1.35rem 1.4rem;
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.65rem;
    }

    .tab {
      border: none;
      background: transparent;
      font-family: "Syne", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.45rem 0.5rem;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab.active {
      color: var(--ink);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: -0.7rem;
      height: 2px;
      background: var(--accent);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.9rem;
    }

    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      padding: 0.7rem 0.8rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .field-row {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    .field-row input {
      flex: 1;
    }

    .check-btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0 0.85rem;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .check-btn:hover {
      background: #fff;
      border-color: rgba(26, 29, 26, 0.22);
    }

    .status {
      min-height: 1.1rem;
      font-size: 0.78rem;
      margin-top: -0.45rem;
      margin-bottom: 0.75rem;
    }

    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }

    .form-msg {
      min-height: 1.15rem;
      font-size: 0.82rem;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .form-msg.err { color: var(--danger); }
    .form-msg.ok { color: var(--ok); }

    .submit {
      width: 100%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: "Syne", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 0.85rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .submit:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .auth-note {
      margin-top: 0.9rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* App */
    .frame {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      border-radius: 2px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.5) inset,
        0 24px 48px -28px rgba(26, 29, 26, 0.35);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    .frame:hover {
      transform: translateY(-3px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.5) inset,
        0 28px 56px -24px rgba(26, 29, 26, 0.4);
    }

    .frame:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .frame.has-image {
      cursor: default;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      transition: opacity 0.35s ease;
    }

    .placeholder strong {
      display: block;
      font-family: "Syne", sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }

    .placeholder p {
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .frame.has-image .placeholder {
      opacity: 0;
      pointer-events: none;
    }

    #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 0.55s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .frame.has-image #preview {
      opacity: 1;
      transform: scale(1);
    }

    #file {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .frame.has-image #file {
      pointer-events: none;
    }

    .change {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      z-index: 2;
      border: none;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.45rem 0.7rem;
      border-radius: 2px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s ease;
      pointer-events: none;
    }

    .frame.has-image:hover .change,
    .frame.has-image:focus-within .change {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .change:hover {
      background: #fff;
    }

    .caption-wrap {
      width: 100%;
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
    }

    #caption {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      text-align: center;
      color: var(--ink);
      padding: 0.55rem 0.25rem 0.7rem;
      outline: none;
      transition: border-color 0.25s ease;
    }

    #caption::placeholder {
      color: #8a928a;
      font-weight: 400;
    }

    #caption:focus {
      border-bottom-color: var(--accent);
      box-shadow: 0 1px 0 0 var(--glow);
    }

    .meta {
      margin-top: 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .register-btn {
      width: 100%;
      margin-top: 1.1rem;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: "Syne", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 0.85rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .register-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .register-msg {
      margin-top: 0.55rem;
      text-align: center;
      font-size: 0.82rem;
      min-height: 1.15rem;
    }

    .register-msg.err { color: var(--danger); }
    .register-msg.ok { color: var(--ok); }

    #char-count.near {
      color: #9a6b2f;
      font-weight: 600;
    }

    #char-count.full {
      color: var(--danger);
      font-weight: 600;
    }

    .streak {
      width: 100%;
      margin-top: 0.35rem;
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--muted);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
    }

    .streak strong {
      color: var(--accent);
      font-weight: 600;
    }

    .archive-streak {
      margin-top: 0;
      padding: 0.85rem 0.9rem;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .calendar {
      width: 100%;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--line);
      padding: 1rem 0.85rem 1.1rem;
    }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .cal-title {
      font-family: "Syne", sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }

    .cal-nav {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      width: 2rem;
      height: 2rem;
      border-radius: 2px;
      cursor: pointer;
    }

    .cal-nav:hover {
      background: #fff;
    }

    .cal-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.2rem;
      margin-bottom: 0.35rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.3rem;
    }

    .cal-day {
      aspect-ratio: 1;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.82rem;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      display: grid;
      place-items: center;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .cal-day:hover:not(:disabled) {
      filter: brightness(0.97);
    }

    .cal-day:disabled {
      color: transparent;
      cursor: default;
      background: transparent;
      border-color: transparent;
    }

    /* 기록 안 한 날 */
    .cal-day.no-entry {
      background: rgba(26, 29, 26, 0.06);
      color: #8a918a;
      border-color: rgba(26, 29, 26, 0.06);
    }

    /* 기록한 날 */
    .cal-day.has-entry {
      background: rgba(47, 107, 79, 0.18);
      color: var(--accent);
      font-weight: 700;
      border-color: rgba(47, 107, 79, 0.35);
    }

    .cal-day.has-entry::after {
      content: "";
      position: absolute;
      bottom: 0.2rem;
      width: 0.3rem;
      height: 0.3rem;
      border-radius: 50%;
      background: var(--accent);
    }

    .cal-day.selected {
      background: var(--accent) !important;
      color: #fff !important;
      font-weight: 700;
      border-color: var(--accent) !important;
    }

    .cal-day.selected.has-entry::after,
    .cal-day.selected.no-entry::after {
      background: #fff;
    }

    .cal-day.today:not(.selected) {
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    .cal-legend {
      display: flex;
      justify-content: center;
      gap: 1.1rem;
      margin-top: 0.85rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .cal-legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .cal-legend i {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 2px;
      display: inline-block;
    }

    .cal-legend .lg-done {
      background: rgba(47, 107, 79, 0.35);
      border: 1px solid rgba(47, 107, 79, 0.5);
    }

    .cal-legend .lg-none {
      background: rgba(26, 29, 26, 0.08);
      border: 1px solid rgba(26, 29, 26, 0.1);
    }

    .archive-detail {
      width: 100%;
      min-height: 12rem;
      text-align: center;
    }

    .archive-date {
      font-family: "Syne", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .archive-photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      display: block;
    }

    .archive-caption {
      margin-top: 0.85rem;
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .archive-empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2.5rem 1rem;
      border: 1px dashed var(--line);
      background: rgba(255, 255, 255, 0.35);
    }

    .hidden {
      display: none !important;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      body {
        padding: 2rem 1rem 2.5rem;
      }

      .stage {
        gap: 1.4rem;
      }

      .topbar {
        top: 0.75rem;
        right: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="topbar" id="topbar">
    <p class="welcome hidden" id="welcome"><strong id="user-name"></strong>님</p>
    <button type="button" class="ghost-btn hidden" id="open-archive">보관함</button>
    <button type="button" class="ghost-btn" id="open-auth">로그인</button>
    <button type="button" class="ghost-btn hidden" id="logout">로그아웃</button>
  </div>

  <!-- 홈: 사진 + 한 줄 -->
  <main class="stage" id="app-view">
    <button type="button" class="brand" data-home aria-label="홈으로 이동">focus<span>now</span></button>
    <p class="brand-sub">결과가 아닌 오늘의 경험과 과정 기록.</p>

    <p class="tagline">
      <em>평범하고 치열한 오늘도 언젠간 추억이 됩니다.</em>
      아무런 사진한장, 간단한 한줄로 오늘을 기록하세요.
    </p>

    <div class="frame" id="frame" role="button" aria-label="사진 추가">
      <div class="placeholder">
        <div>
          <strong>사진 한 장</strong>
          <p>클릭해서 이미지를 넣으세요</p>
        </div>
      </div>
      <img id="preview" alt="선택한 사진" hidden />
      <input id="file" type="file" accept="image/*" aria-label="이미지 선택" />
      <button type="button" class="change" id="change" hidden>바꾸기</button>
    </div>

    <div class="caption-wrap">
      <input
        id="caption"
        type="text"
        maxlength="20"
        placeholder="한 줄만 적으세요"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="meta">
        <span>문장 한 줄</span>
        <span id="char-count">0 / 20</span>
      </div>
      <button type="button" class="register-btn" id="register-btn">등록하기</button>
      <p class="register-msg" id="register-msg" aria-live="polite"></p>
    </div>

    <p class="streak hidden" id="streak" aria-live="polite"></p>
  </main>

  <!-- 로그인 / 회원가입 -->
  <main class="stage hidden" id="auth-view">
    <button type="button" class="brand" data-home aria-label="홈으로 이동">focus<span>now</span></button>
    <p class="brand-sub">결과가 아닌 오늘의 경험과 과정 기록.</p>

    <section class="auth-card" aria-label="로그인">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tab-login" role="tab" aria-selected="true">로그인</button>
        <button type="button" class="tab" id="tab-signup" role="tab" aria-selected="false">회원가입</button>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-id">아이디</label>
          <input id="login-id" name="username" type="text" required maxlength="20" autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-pw">비밀번호</label>
          <input id="login-pw" name="password" type="password" required maxlength="40" autocomplete="current-password" />
        </div>
        <p class="form-msg" id="login-msg" aria-live="polite"></p>
        <button type="submit" class="submit">로그인</button>
      </form>

      <form id="signup-form" class="hidden" autocomplete="on">
        <div class="field">
          <label for="signup-name">이름</label>
          <input id="signup-name" name="name" type="text" required maxlength="20" autocomplete="name" />
        </div>
        <div class="field">
          <label for="signup-id">아이디</label>
          <div class="field-row">
            <input id="signup-id" name="username" type="text" required maxlength="20" autocomplete="username" />
            <button type="button" class="check-btn" id="check-id">중복확인</button>
          </div>
        </div>
        <p class="status" id="id-status" aria-live="polite"></p>
        <div class="field">
          <label for="signup-pw">비밀번호</label>
          <input id="signup-pw" name="password" type="password" required minlength="4" maxlength="40" autocomplete="new-password" />
        </div>
        <p class="form-msg" id="signup-msg" aria-live="polite"></p>
        <button type="submit" class="submit">가입하기</button>
      </form>

      <p class="auth-note">계정은 이 브라우저에만 저장됩니다</p>
    </section>
  </main>

  <!-- 보관함 -->
  <main class="stage hidden" id="archive-view">
    <button type="button" class="brand" data-home aria-label="홈으로 이동">focus<span>now</span></button>
    <p class="brand-sub">결과가 아닌 오늘의 경험과 과정 기록.</p>

    <p class="streak archive-streak" id="archive-streak" aria-live="polite"></p>

    <section class="calendar" aria-label="기록 캘린더">
      <div class="cal-head">
        <button type="button" class="cal-nav" id="cal-prev" aria-label="이전 달">‹</button>
        <h2 class="cal-title" id="cal-title">2026년 7월</h2>
        <button type="button" class="cal-nav" id="cal-next" aria-label="다음 달">›</button>
      </div>
      <div class="cal-week" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <div class="cal-legend" aria-hidden="true">
        <span><i class="lg-done"></i>기록한 날</span>
        <span><i class="lg-none"></i>기록 안 한 날</span>
      </div>
    </section>

    <section class="archive-detail" id="archive-detail">
      <p class="archive-date" id="archive-date"></p>
      <img class="archive-photo hidden" id="archive-photo" alt="그날의 사진" />
      <p class="archive-caption hidden" id="archive-caption"></p>
      <p class="archive-empty" id="archive-empty">날짜를 선택하면 기록이 보여요</p>
    </section>
  </main>

  <script>
    const USERS_KEY = "focusnow_users";
    const SESSION_KEY = "focusnow_session";
    const CAPTION_MAX = 20;

    const authView = document.getElementById("auth-view");
    const appView = document.getElementById("app-view");
    const archiveView = document.getElementById("archive-view");
    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const loginMsg = document.getElementById("login-msg");
    const signupMsg = document.getElementById("signup-msg");
    const idStatus = document.getElementById("id-status");
    const checkIdBtn = document.getElementById("check-id");
    const signupId = document.getElementById("signup-id");
    const userNameEl = document.getElementById("user-name");
    const welcomeEl = document.getElementById("welcome");
    const openAuthBtn = document.getElementById("open-auth");
    const openArchiveBtn = document.getElementById("open-archive");
    const logoutBtn = document.getElementById("logout");
    const topbar = document.getElementById("topbar");
    const registerBtn = document.getElementById("register-btn");
    const registerMsg = document.getElementById("register-msg");

    const frame = document.getElementById("frame");
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const changeBtn = document.getElementById("change");
    const caption = document.getElementById("caption");
    const charCount = document.getElementById("char-count");
    const streakEl = document.getElementById("streak");
    const archiveStreakEl = document.getElementById("archive-streak");
    const calTitle = document.getElementById("cal-title");
    const calDays = document.getElementById("cal-days");
    const calPrev = document.getElementById("cal-prev");
    const calNext = document.getElementById("cal-next");
    const archiveDateEl = document.getElementById("archive-date");
    const archivePhoto = document.getElementById("archive-photo");
    const archiveCaption = document.getElementById("archive-caption");
    const archiveEmpty = document.getElementById("archive-empty");

    let idChecked = false;
    let idAvailable = false;
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selectedDate = todayKeySafe();

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatDateKey(d) {
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function todayKeySafe() {
      return formatDateKey(new Date());
    }

    function todayKey() {
      return todayKeySafe();
    }

    function yesterdayKey() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return formatDateKey(d);
    }

    function formatDisplayDate(dateKey) {
      const parts = dateKey.split("-");
      if (parts.length !== 3) return dateKey;
      return parts[0] + "년 " + Number(parts[1]) + "월 " + Number(parts[2]) + "일";
    }

    function streakKey(userId) {
      return "focusnow_streak_" + userId;
    }

    function archiveKey(userId) {
      return "focusnow_archive_" + userId;
    }

    function legacyPostKey(userId) {
      return "focusnow_post_" + userId;
    }

    function getArchive(userId) {
      try {
        const raw = localStorage.getItem(archiveKey(userId));
        if (raw) return JSON.parse(raw) || {};
      } catch (_) {}

      // 이전 단일 저장본 → 오늘 날짜로 이전
      try {
        const legacy = localStorage.getItem(legacyPostKey(userId));
        if (legacy) {
          const data = JSON.parse(legacy);
          const migrated = {};
          if (data && (data.image || (data.caption && String(data.caption).trim()))) {
            migrated[todayKey()] = {
              image: data.image || "",
              caption: String(data.caption || "").slice(0, CAPTION_MAX)
            };
            localStorage.setItem(archiveKey(userId), JSON.stringify(migrated));
          }
          return migrated;
        }
      } catch (_) {}
      return {};
    }

    function saveArchive(userId, archive) {
      localStorage.setItem(archiveKey(userId), JSON.stringify(archive));
    }

    function getDayEntry(userId, dateKey) {
      const archive = getArchive(userId);
      return archive[dateKey] || null;
    }

    function setDayEntry(userId, dateKey, data) {
      const archive = getArchive(userId);
      archive[dateKey] = {
        image: data.image || "",
        caption: String(data.caption || "").slice(0, CAPTION_MAX)
      };
      saveArchive(userId, archive);
    }

    function getStreakData(userId) {
      try {
        return JSON.parse(localStorage.getItem(streakKey(userId)) || "null") || { lastDate: "", streak: 0 };
      } catch (_) {
        return { lastDate: "", streak: 0 };
      }
    }

    function saveStreakData(userId, data) {
      localStorage.setItem(streakKey(userId), JSON.stringify(data));
    }

    function getDisplayStreak(userId) {
      const data = getStreakData(userId);
      const today = todayKey();
      const yesterday = yesterdayKey();
      if (!data.lastDate || data.streak < 1) return 0;
      if (data.lastDate === today || data.lastDate === yesterday) return data.streak;
      return 0;
    }

    function touchStreak(userId) {
      const today = todayKey();
      const yesterday = yesterdayKey();
      const data = getStreakData(userId);

      if (data.lastDate === today) {
        if (data.streak < 1) data.streak = 1;
      } else if (data.lastDate === yesterday) {
        data.streak = (data.streak || 0) + 1;
        data.lastDate = today;
      } else {
        data.streak = 1;
        data.lastDate = today;
      }
      saveStreakData(userId, data);
      return data.streak;
    }

    function streakText(user) {
      const days = getDisplayStreak(user.id);
      return user.name + "님은 현재 <strong>" + days + "일</strong> 연속으로 소중한 하루를 기록중 입니다.";
    }

    function updateStreakMessage(user) {
      if (!user) {
        streakEl.classList.add("hidden");
        streakEl.textContent = "";
        archiveStreakEl.textContent = "";
        return;
      }
      const html = streakText(user);
      streakEl.innerHTML = html;
      streakEl.classList.remove("hidden");
      archiveStreakEl.innerHTML = html;
    }

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
      } catch (_) {
        return [];
      }
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch (_) {
        return null;
      }
    }

    function setSession(user) {
      if (!user) {
        localStorage.removeItem(SESSION_KEY);
        return;
      }
      localStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id, name: user.name }));
    }

    function normalizeId(id) {
      return String(id || "").trim().toLowerCase();
    }

    function findUser(id) {
      const key = normalizeId(id);
      return getUsers().find((u) => u.id === key);
    }

    function currentUser() {
      const session = getSession();
      if (!session) return null;
      return findUser(session.id) || null;
    }

    function updateTopbar(user) {
      if (user) {
        userNameEl.textContent = user.name;
        welcomeEl.classList.remove("hidden");
        openArchiveBtn.classList.remove("hidden");
        openAuthBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
      } else {
        userNameEl.textContent = "";
        welcomeEl.classList.add("hidden");
        openArchiveBtn.classList.add("hidden");
        openAuthBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
      }
    }

    function hideAllViews() {
      appView.classList.add("hidden");
      authView.classList.add("hidden");
      archiveView.classList.add("hidden");
    }

    function showAuth() {
      hideAllViews();
      authView.classList.remove("hidden");
      topbar.classList.add("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /** 홈 = 사진 올리고 한 줄 쓰는 공간 */
    function showHome(user) {
      hideAllViews();
      appView.classList.remove("hidden");
      topbar.classList.remove("hidden");
      updateTopbar(user || null);
      if (user) {
        loadTodayPost(user.id);
        updateStreakMessage(user);
      } else {
        clearImageUi();
        caption.value = "";
        updateCharCount();
        updateStreakMessage(null);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showArchive(user) {
      if (!user) {
        requireLogin();
        return;
      }
      hideAllViews();
      archiveView.classList.remove("hidden");
      topbar.classList.remove("hidden");
      updateTopbar(user);
      updateStreakMessage(user);
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      selectedDate = todayKey();
      renderCalendar(user.id);
      showArchiveDay(user.id, selectedDate);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function requireLogin() {
      if (currentUser()) return true;
      showAuth();
      switchTab("login");
      loginMsg.textContent = "홈을 이용하려면 로그인해주세요.";
      loginMsg.className = "form-msg err";
      return false;
    }

    function switchTab(mode) {
      const isLogin = mode === "login";
      tabLogin.classList.toggle("active", isLogin);
      tabSignup.classList.toggle("active", !isLogin);
      tabLogin.setAttribute("aria-selected", String(isLogin));
      tabSignup.setAttribute("aria-selected", String(!isLogin));
      loginForm.classList.toggle("hidden", !isLogin);
      signupForm.classList.toggle("hidden", isLogin);
      loginMsg.textContent = "";
      loginMsg.className = "form-msg";
      signupMsg.textContent = "";
      signupMsg.className = "form-msg";
    }

    function setIdStatus(text, type) {
      idStatus.textContent = text;
      idStatus.className = "status" + (type ? " " + type : "");
    }

    function resetIdCheck() {
      idChecked = false;
      idAvailable = false;
      setIdStatus("");
    }

    function updateCharCount() {
      const len = caption.value.length;
      charCount.textContent = len + " / " + CAPTION_MAX;
      charCount.classList.remove("near", "full");
      if (len >= CAPTION_MAX) charCount.classList.add("full");
      else if (len >= CAPTION_MAX - 5) charCount.classList.add("near");
    }

    function setImage(dataUrl) {
      if (!dataUrl) return;
      preview.src = dataUrl;
      preview.hidden = false;
      frame.classList.add("has-image");
      changeBtn.hidden = false;
      fileInput.setAttribute("tabindex", "-1");
    }

    function clearImageUi() {
      preview.removeAttribute("src");
      preview.hidden = true;
      frame.classList.remove("has-image");
      changeBtn.hidden = true;
      fileInput.removeAttribute("tabindex");
      fileInput.value = "";
    }

    function savePost(options) {
      const touch = !options || options.touchStreak !== false;
      const session = getSession();
      if (!session) return false;
      const data = {
        image: preview.getAttribute("src") || "",
        caption: caption.value
      };
      try {
        setDayEntry(session.id, todayKey(), data);
      } catch (_) {
        try {
          setDayEntry(session.id, todayKey(), { image: "", caption: data.caption });
        } catch (__) {
          return false;
        }
      }

      if (touch && (data.image || data.caption.trim())) {
        touchStreak(session.id);
        const user = currentUser();
        if (user) updateStreakMessage(user);
      }
      return true;
    }

    function loadTodayPost(userId) {
      clearImageUi();
      caption.value = "";
      const data = getDayEntry(userId, todayKey());
      if (data) {
        if (data.image) setImage(data.image);
        if (typeof data.caption === "string") caption.value = data.caption.slice(0, CAPTION_MAX);
      }
      updateCharCount();
    }

    function renderCalendar(userId) {
      const archive = getArchive(userId);
      calTitle.textContent = calYear + "년 " + (calMonth + 1) + "월";
      calDays.innerHTML = "";

      const first = new Date(calYear, calMonth, 1);
      const startPad = first.getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const today = todayKey();

      for (let i = 0; i < startPad; i++) {
        const empty = document.createElement("button");
        empty.type = "button";
        empty.className = "cal-day";
        empty.disabled = true;
        calDays.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = calYear + "-" + pad2(calMonth + 1) + "-" + pad2(day);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cal-day";
        btn.textContent = String(day);
        btn.dataset.date = dateKey;

        if (archive[dateKey] && (archive[dateKey].image || (archive[dateKey].caption || "").trim())) {
          btn.classList.add("has-entry");
          btn.title = "기록 있음";
          btn.setAttribute("aria-label", day + "일, 기록 있음");
        } else {
          btn.classList.add("no-entry");
          btn.title = "기록 없음";
          btn.setAttribute("aria-label", day + "일, 기록 없음");
        }
        if (dateKey === today) btn.classList.add("today");
        if (dateKey === selectedDate) btn.classList.add("selected");

        btn.addEventListener("click", () => {
          selectedDate = dateKey;
          renderCalendar(userId);
          showArchiveDay(userId, dateKey);
        });
        calDays.appendChild(btn);
      }
    }

    function showArchiveDay(userId, dateKey) {
      archiveDateEl.textContent = formatDisplayDate(dateKey);
      const entry = getDayEntry(userId, dateKey);
      const hasContent = entry && (entry.image || (entry.caption || "").trim());

      if (!hasContent) {
        archivePhoto.classList.add("hidden");
        archivePhoto.removeAttribute("src");
        archiveCaption.classList.add("hidden");
        archiveCaption.textContent = "";
        archiveEmpty.classList.remove("hidden");
        archiveEmpty.textContent = "이 날에는 기록이 없어요";
        return;
      }

      archiveEmpty.classList.add("hidden");
      if (entry.image) {
        archivePhoto.src = entry.image;
        archivePhoto.classList.remove("hidden");
      } else {
        archivePhoto.classList.add("hidden");
        archivePhoto.removeAttribute("src");
      }

      if ((entry.caption || "").trim()) {
        archiveCaption.textContent = entry.caption;
        archiveCaption.classList.remove("hidden");
      } else {
        archiveCaption.classList.add("hidden");
        archiveCaption.textContent = "";
      }
    }

    tabLogin.addEventListener("click", () => switchTab("login"));
    tabSignup.addEventListener("click", () => switchTab("signup"));

    signupId.addEventListener("input", resetIdCheck);

    checkIdBtn.addEventListener("click", () => {
      const id = normalizeId(signupId.value);
      if (!id) {
        setIdStatus("아이디를 입력하세요.", "err");
        idChecked = false;
        idAvailable = false;
        return;
      }
      if (id.length < 3) {
        setIdStatus("아이디는 3자 이상이어야 합니다.", "err");
        idChecked = false;
        idAvailable = false;
        return;
      }
      if (!/^[a-z0-9_]+$/.test(id)) {
        setIdStatus("영문 소문자, 숫자, _ 만 사용할 수 있습니다.", "err");
        idChecked = false;
        idAvailable = false;
        return;
      }
      if (findUser(id)) {
        setIdStatus("이미 사용 중인 아이디입니다.", "err");
        idChecked = true;
        idAvailable = false;
        return;
      }
      setIdStatus("사용 가능한 아이디입니다.", "ok");
      idChecked = true;
      idAvailable = true;
    });

    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      signupMsg.className = "form-msg";
      signupMsg.textContent = "";

      const name = document.getElementById("signup-name").value.trim();
      const id = normalizeId(signupId.value);
      const password = document.getElementById("signup-pw").value;

      if (!name) {
        signupMsg.textContent = "이름을 입력하세요.";
        signupMsg.classList.add("err");
        return;
      }
      if (!idChecked || !idAvailable) {
        signupMsg.textContent = "아이디 중복확인을 해주세요.";
        signupMsg.classList.add("err");
        return;
      }
      if (password.length < 4) {
        signupMsg.textContent = "비밀번호는 4자 이상이어야 합니다.";
        signupMsg.classList.add("err");
        return;
      }
      if (findUser(id)) {
        setIdStatus("이미 사용 중인 아이디입니다.", "err");
        idAvailable = false;
        signupMsg.textContent = "다른 아이디를 사용하세요.";
        signupMsg.classList.add("err");
        return;
      }

      const users = getUsers();
      users.push({ id, name, password });
      saveUsers(users);

      signupMsg.textContent = "가입 완료! 로그인해주세요.";
      signupMsg.classList.add("ok");
      signupForm.reset();
      resetIdCheck();

      setTimeout(() => {
        switchTab("login");
        document.getElementById("login-id").value = id;
        document.getElementById("login-pw").focus();
      }, 600);
    });

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loginMsg.className = "form-msg";
      loginMsg.textContent = "";

      const id = normalizeId(document.getElementById("login-id").value);
      const password = document.getElementById("login-pw").value;
      const user = findUser(id);

      if (!user || user.password !== password) {
        loginMsg.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
        loginMsg.classList.add("err");
        return;
      }

      setSession(user);
      loginForm.reset();
      showHome(user);
    });

    openAuthBtn.addEventListener("click", () => {
      showAuth();
      switchTab("login");
    });

    openArchiveBtn.addEventListener("click", () => {
      showArchive(currentUser());
    });

    calPrev.addEventListener("click", () => {
      const user = currentUser();
      if (!user) return;
      calMonth -= 1;
      if (calMonth < 0) {
        calMonth = 11;
        calYear -= 1;
      }
      renderCalendar(user.id);
    });

    calNext.addEventListener("click", () => {
      const user = currentUser();
      if (!user) return;
      calMonth += 1;
      if (calMonth > 11) {
        calMonth = 0;
        calYear += 1;
      }
      renderCalendar(user.id);
    });

    registerBtn.addEventListener("click", () => {
      registerMsg.className = "register-msg";
      registerMsg.textContent = "";

      if (!requireLogin()) return;

      const hasImage = !!(preview.getAttribute("src"));
      const hasCaption = caption.value.trim().length > 0;

      if (!hasImage) {
        registerMsg.textContent = "사진을 먼저 올려주세요.";
        registerMsg.classList.add("err");
        return;
      }
      if (!hasCaption) {
        registerMsg.textContent = "한 줄 문장을 적어주세요.";
        registerMsg.classList.add("err");
        return;
      }

      const ok = savePost({ touchStreak: true });
      if (!ok) {
        registerMsg.textContent = "저장에 실패했습니다. 다시 시도해주세요.";
        registerMsg.classList.add("err");
        return;
      }

      registerMsg.textContent = "오늘의 기록이 등록되었습니다.";
      registerMsg.classList.add("ok");
    });

    logoutBtn.addEventListener("click", () => {
      setSession(null);
      showHome(null);
    });

    function goHome() {
      showHome(currentUser());
    }

    document.querySelectorAll("[data-home]").forEach((el) => {
      el.addEventListener("click", goHome);
    });

    fileInput.addEventListener("click", (e) => {
      if (!currentUser()) {
        e.preventDefault();
        requireLogin();
      }
    });

    fileInput.addEventListener("change", () => {
      if (!requireLogin()) {
        fileInput.value = "";
        return;
      }
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        setImage(String(reader.result));
        savePost({ touchStreak: false });
        registerMsg.textContent = "";
        registerMsg.className = "register-msg";
      };
      reader.readAsDataURL(file);
    });

    changeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!requireLogin()) return;
      fileInput.click();
    });

    caption.addEventListener("focus", () => {
      requireLogin();
    });

    caption.addEventListener("input", () => {
      if (!currentUser()) {
        caption.value = "";
        updateCharCount();
        requireLogin();
        return;
      }
      if (caption.value.includes("\n")) {
        caption.value = caption.value.replace(/\n/g, " ");
      }
      updateCharCount();
      savePost({ touchStreak: false });
      registerMsg.textContent = "";
      registerMsg.className = "register-msg";
    });

    caption.addEventListener("keydown", (e) => {
      if (e.key === "Enter") e.preventDefault();
    });

    // 시작 → 홈(사진 + 한 줄)
    const user = currentUser();
    if (!user) setSession(null);
    showHome(user);
  </script>
</body>
</html>
